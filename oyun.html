<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Başkan Simülatörü</title>
<style>
html,body{margin:0;height:100%;background:#0b1530;color:#f3d27a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#l{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;box-sizing:border-box}
.bar{width:240px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f3d27a;transition:width .2s}
a{color:#8ec5ff}
</style>
</head>
<body>
<div id="l"><div style="font-size:22px;font-weight:700">Başkan Simülatörü</div><div id="m">Oyun yükleniyor…</div><div class="bar"><i id="b"></i></div></div>
<script>
(async function(){
  var N=12, parts=[], done=0, bar=document.getElementById('b'), msg=document.getElementById('m');
  try{
    var v='?v=3';
    await Promise.all(Array.from({length:N},function(_,i){
      var name='g3/p'+String(i).padStart(2,'0')+'.txt'+v;
      return fetch(name,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('Parça '+i+' alınamadı ('+r.status+')');return r.text();}).then(function(t){parts[i]=t.trim();done++;bar.style.width=(done/N*100)+'%';});
    }));
    var b64=parts.join('');
    var bin=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0);});
    var stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    var html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);
    msg.innerHTML='Oyun yüklenemedi. Sayfayı yenileyip tekrar dene; sorun sürerse tarayıcını güncelle.<br><small>'+String(e&&e.message||e)+'</small><br><a href="./">Ana sayfaya dön</a>';
  }
})();
</script>
</body>
</html>
